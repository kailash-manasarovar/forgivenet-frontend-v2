    <h1>Request forgiveness</h1>

    <p>
        Connect your wallet to Sepolia and submit your forgiveness request.
    </p>

    <div id="wallet">

        <button id="connect">
            Connect Wallet
        </button>

        <p id="account">
            Wallet: Not connected
        </p>

        <p id="network">
            Network: —
        </p>

    </div>

    <form id="request-form">

        <label for="requestText">
            Forgiveness request
        </label>

        <textarea id="requestText" placeholder="Enter your forgiveness request..."></textarea>

        <label for="donation">
            Donation (ETH)
        </label>

        <input id="donation" type="number" step="any" min="0" placeholder="Minimum 0.000001 ETH" required>

        <button type="submit">
            Send Request
        </button>

    </form>

    <div id="status"></div>
