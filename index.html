<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.ico">
    <title>forgivenet</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <nav class="main-nav">
        <a href="/">Home</a>
        <a href="ledger.html">Ledger</a>
        <a href="whitepaper.html" target="_blank" rel="noopener">Whitepaper</a>
        <a href="quick-start.html">Quick Start</a>
    </nav>

    <h1>Request forgiveness</h1>

    <p>
        Connect your wallet to Sepolia and submit your forgiveness request.
    </p>

    <div id="wallet">

        <button id="connect">
            Connect Wallet
        </button>

        <p id="account">
            Wallet: Not connected
        </p>

        <p id="network">
            Network: —
        </p>

    </div>

    <form id="request-form">

        <label for="requestText">
            Forgiveness request
        </label>

        <textarea id="requestText" placeholder="Enter your forgiveness request..." required></textarea>

        <label for="donation">
            Donation (ETH)
        </label>

        <input id="donation" type="number" step="any" min="0" placeholder="Minimum 0.000001 ETH" required>

        <button type="submit">
            Send Request
        </button>

    </form>

    <div id="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/web3@4.0.3/dist/web3.min.js"></script>
    <script src="app.js"></script>

</body>

</html>
